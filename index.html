<script id="app-code">
'use strict';
const Model = (() => {
  const statuses = ['Nowe', 'W realizacji', 'Oczekuje na części', 'Oczekuje na informację', 'Zamknięte', 'Odrzucone'];
  const priorities = ['Niski', 'Średni', 'Wysoki'];
  const roles = ['Użytkownik', 'Koordynator', 'Administrator'];
  const closed = t => ['Zamknięte', 'Odrzucone'].includes(t.status);
  const visible = (state, user) => user.role === 'Użytkownik' ? state.tickets.filter(t => t.creatorId === user.id) : state.tickets;
  const critical = t => !closed(t) && (t.priority === 'Wysoki' || t.blocksSales);
  const overdue = (t, now = Date.now()) => !closed(t) && !!t.dueAt && Date.parse(t.dueAt) < now;
  const waiting = (t, hours = 48, now = Date.now()) => !closed(t) && !t.firstResponseAt && now - Date.parse(t.createdAt) >= hours * 3600000;
  function metrics(tickets, now = Date.now(), hours = 48) {
    const completed = tickets.filter(t => t.status === 'Zamknięte' && t.closedAt);
    return { total: tickets.length, fresh: tickets.filter(t => t.status === 'Nowe').length, progress: tickets.filter(t => t.status === 'W realizacji').length, completed: completed.length, critical: tickets.filter(critical).length, overdue: tickets.filter(t => overdue(t, now)).length, waiting: tickets.filter(t => waiting(t, hours, now)).length, meanHours: completed.length ? completed.reduce((n, t) => n + Math.max(0, Date.parse(t.closedAt) - Date.parse(t.createdAt)), 0) / completed.length / 3600000 : null };
  }
  function validateTicket(data, state) {
    const place = state.locations.find(l => l.mpk === data.mpk && l.active);
    if (!place || place.city !== data.city) throw Error('Wybierz aktywny obiekt z wybranego miasta.');
    if (!String(data.reporter).trim() || String(data.reporter).length > 150) throw Error('Podaj imię i nazwisko zgłaszającego (do 150 znaków).');
    if (!state.settings.categories.includes(data.category)) throw Error('Wybierz rodzaj usterki.');
    if (!priorities.includes(data.priority)) throw Error('Wybierz poziom alertu.');
    if (String(data.description).trim().length < 10 || String(data.description).length > 10000) throw Error('Opis musi zawierać od 10 do 10 000 znaków.');
    return place;
  }
  function updateTicket(ticket, values, user, users, now) {
    if (!['Koordynator', 'Administrator'].includes(user.role)) throw Error('Ta funkcja jest dostępna w widoku koordynatora i administratora.');
    if (closed(ticket)) throw Error('Zgłoszenie jest zakończone; dane obsługi są zablokowane.');
    if (!statuses.includes(values.status) || !priorities.includes(values.priority)) throw Error('Nieprawidłowy status lub alert.');
    if (values.assigneeId && !users.some(u => u.id === values.assigneeId && u.active && u.role !== 'Użytkownik')) throw Error('Wybierz aktywnego koordynatora lub administratora.');
    const isEnd = ['Zamknięte', 'Odrzucone'].includes(values.status);
    const closingComment = String(values.closingComment ?? '').trim();
    if (isEnd && !closingComment) throw Error(values.status === 'Odrzucone' ? 'Podaj powód odrzucenia.' : 'Opisz wykonane prace.');
    if (isEnd && closingComment.length > 5000) throw Error('Komentarz może mieć do 5000 znaków.');
    if (values.dueAt && !Number.isFinite(Date.parse(values.dueAt))) throw Error('Nieprawidłowy termin realizacji.');
    return { ...ticket, status: values.status, priority: values.priority, assigneeId: values.assigneeId, dueAt: values.dueAt || null, closingComment: isEnd ? closingComment : '', firstResponseAt: ticket.firstResponseAt || now, closedAt: isEnd ? now : null, updatedAt: now };
  }
  function validateUserChange(users, proposed) {
    if (!roles.includes(proposed.role)) throw Error('Nieprawidłowa rola.');
    if (!proposed.name.trim() || proposed.name.length > 150) throw Error('Podaj nazwę użytkownika (do 150 znaków).');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(proposed.email)) throw Error('Podaj poprawny adres e-mail.');
    if (users.some(u => u.id !== proposed.id && u.email.toLowerCase() === proposed.email.toLowerCase())) throw Error('Ten e-mail jest już przypisany do profilu.');
    const next = users.filter(u => u.id !== proposed.id).concat(proposed);
    if (!next.some(u => u.active && u.role === 'Administrator')) throw Error('Musi pozostać co najmniej jeden aktywny administrator.');
  }
  function csvCell(value) {
    let text = String(value ?? '');
    if (/^[\s]*[=+\-@]/.test(text)) text = "'" + text;
    return '"' + text.replaceAll('"', '""') + '"';
  }
  function initial(locations) {
    return { version: 1, revision: 0, counter: 0, locations, tickets: [], comments: [], notifications: [], users: [
      {id: 'demo-admin', name: 'Administrator testowy', email: 'administrator@example.test', role: 'Administrator', active: true},
      {id: 'demo-coord', name: 'Koordynator testowy', email: 'koordynator@example.test', role: 'Koordynator', active: true},
      {id: 'demo-user', name: 'Użytkownik testowy', email: 'uzytkownik@example.test', role: 'Użytkownik', active: true}
    ], settings: { categories: ['Elektryka i oświetlenie','Klimatyzacja i wentylacja','Instalacja wodna i kanalizacja','Urządzenia chłodnicze','Sprzęt gastronomiczny','Drzwi, zamki i zabezpieczenia','Wyposażenie lokalu','IT i system sprzedażowy','Inna'], responseHours:48, maxFiles:5, maxMB:10 } };
  }
  function migrate(state) {
    // Rozszerzenie starej bazy bez usuwania zgłoszeń, plików lub profili.
    if (state.notifications === undefined) state.notifications = [];
    return state;
  }
  function notificationsFor(state, user) {
    if (!user || !user.active) return [];
    const allowed = new Set(visible(state,user).map(t=>t.id));
    return (state.notifications || []).filter(n => n.recipientId === user.id && allowed.has(n.ticketId))
      .sort((a,b)=>b.createdAt.localeCompare(a.createdAt)||b.id.localeCompare(a.id));
  }
  function notificationEvents(before, after, actorId, now) {
    const actor=after.users.find(u=>u.id===actorId);
    if (!actor) return [];
    const result=[], previousTickets=new Map(before.tickets.map(t=>[t.id,t]));
    const oldComments=new Set(before.comments.map(c=>c.id));
    const previousNotifications=new Set((after.notifications||[]).map(n=>n.id));
    function emit(ticket,eventId,type,title,body) {
      const recipients=after.users.filter(u=>u.active && u.id!==actorId && (u.id===ticket.creatorId || u.role!=='Użytkownik'));
      for (const recipient of recipients) {
        const id=eventId+'-'+recipient.id;
        if (!previousNotifications.has(id)) result.push({id,eventId,ticketId:ticket.id,recipientId:recipient.id,actorId,type,title,body,createdAt:now,readAt:null});
      }
    }
    for (const ticket of after.tickets) {
      const old=previousTickets.get(ticket.id);
      if (!old) {emit(ticket,'new-'+ticket.id,'new','Nowe zgłoszenie · '+ticket.number,actor.name+' zgłasza: '+ticket.mpk+' · '+ticket.locationName+'. Alert: '+ticket.priority+'.');continue;}

put id="blocksSales" name="blocksSales" type="checkbox"><label for="blocksSales">Usterka blokuje sprzedaż</label></div><div class="field full"><label for="description">Opis usterki <span class="required">*</span></label><textarea id="description" name="description" minlength="10" maxlength="10000" required placeholder="Co się stało? Gdzie dokładnie występuje problem i od kiedy?" rows="5"></textarea><p class="hint">Od 10 do 10 000 znaków. Nie wpisuj haseł ani danych klientów.</p></div></div><div class="section-title separated"><span class="num">03</span><div><h2>Załączniki</h2><p>Zdjęcie lub dokument pomoże w ocenie usterki.</p></div></div><div class="dropzone" id="dropzone">${icon('clip')}<strong>Wybierz pliki lub przeciągnij je tutaj</strong><p>JPG, PNG, PDF · do ${state.settings.maxFiles} plików · maks. ${state.settings.maxMB} MB każdy</p><input id="attachments" type="file" multiple accept=".jpg,.jpeg,.png,.pdf" aria-label="Dodaj zdjęcia lub PDF"></div><div id="draft-files"></div><div class="form-bottom"><span>* Pola wymagane</span><button class="btn" type="submit">Wyślij zgłoszenie ${icon('arrow')}</button></div></form></div>`;}
function filteredTickets(){return currentTickets().filter(t=>(!filters.status||t.status===filters.status)&&(!filters.city||t.city===filters.city)&&(!filters.priority||t.priority===filters.priority)&&(!filters.q||[t.number,t.mpk,t.locationName,t.description,t.category,t.reporter].join(' ').toLocaleLowerCase('pl').includes(filters.q.toLocaleLowerCase('pl')))&&(!filters.from||t.createdAt>=new Date(filters.from+'T00:00').toISOString())&&(!filters.to||t.createdAt<=new Date(filters.to+'T23:59:59.999').toISOString()));}
function filterForm(dates=false){const cities=[...new Set(currentTickets().map(t=>t.city))].sort();return `<form id="filter-form" class="filters"><div class="field"><label for="filter-q">Szukaj zgłoszenia</label><input id="filter-q" name="q" value="${esc(filters.q)}" placeholder="Numer, MPK, nazwa lub opis…"></div><div class="field"><label for="filter-status">Status</label><select id="filter-status" name="status">${option('','Wszystkie statusy',filters.status)}${Model.statuses.map(s=>option(s,s,filters.status)).join('')}</select></div><div class="field"><label for="filter-city">Miasto</label><select id="filter-city" name="city">${option('','Wszystkie miasta',filters.city)}${cities.map(c=>option(c,c,filters.city)).join('')}</select></div><div class="field"><label for="filter-priority">Alert</label><select id="filter-priority" name="priority">${option('','Wszystkie alerty',filters.priority)}${Model.priorities.map(p=>option(p,p,filters.priority)).join('')}</select></div>${dates?`<div class="field"><label for="filter-from">Zgłoszone od</label><input id="filter-from" type="date" name="from" value="${esc(filters.from)}"></div><div class="field"><label for="filter-to">Zgłoszone do</label><input id="filter-to" type="date" name="to" value="${esc(filters.to)}"></div>`:''}<button class="btn secondary" type="submit">Filtruj</button><button class="btn secondary" type="button" data-action="clear-filters">Wyczyść</button></form>`;}
function ticketsView(){const tickets=filteredTickets();return header(canManage()?'Wszystkie zgłoszenia':'Moje zgłoszenia',canManage()?'Ustal priorytety, przypisz naprawy i kontroluj terminy.':'Zgłoszenia utworzone przez wybrany profil testowy.',btn('new','Zgłoś usterkę'))+filterForm()+`<section class="panel table-panel">${tickets.length?ticketTable(tickets):empty('Nie znaleziono zgłoszeń',currentTickets().length?'Zmień filtry lub wyczyść wyszukiwanie.':'Dodaj pierwsze zgłoszenie, aby sprawdzić cały obieg naprawy.',btn('new','Zgłoś usterkę'))}</section>`;}
function bars(tickets,key){const groups=new Map();for(const t of tickets){const label=key==='location'?t.mpk+' · '+t.locationName:t[key];groups.set(label,(groups.get(label)||0)+1);}const sorted=[...groups.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'pl'));const max=sorted[0]?.[1]||1;return sorted.length?sorted.map(([label,n])=>`<div class="bar-row"><span class="bar-label">${esc(label)}</span><span class="bar-track" aria-hidden="true"><span class="bar-fill" style="display:block;width:${n/max*100}%"></span></span><strong>${n}</strong></div>`).join(''):'<p class="report-copy">Brak danych do wyświetlenia.</p>';}
function dashboardView(){const tickets=filteredTickets();const m=Model.metrics(tickets,Date.now(),state.settings.responseHours);return header('Dashboard',canManage()?'Przegląd usterek i terminów realizacji.':'Podsumowanie zgłoszeń wybranego profilu.')+filterForm(true)+statsView(tickets)+`<div class="metric-strip"><section class="panel"><h3>Średni czas realizacji</h3><strong>${m.meanHours===null?'—':m.meanHours.toLocaleString('pl-PL',{maximumFractionDigits:1})+' h'}</strong><small>${m.completed} zamkniętych · bez odrzuconych</small></section><section class="panel"><h3>Wymagają reakcji</h3><strong>${m.overdue} <span class="muted" style="font-size:13px">po terminie</span></strong><small>${m.waiting} bez reakcji przez ${state.settings.responseHours} h</small></section></div><div class="chart-grid"><section class="panel"><div class="block-heading"><h2>Usterki wg miasta</h2></div>${bars(tickets,'city')}</section><section class="panel"><div class="block-heading"><h2>Usterki wg rodzaju</h2></div>${bars(tickets,'category')}</section><section class="panel full"><div class="block-heading"><h2>Usterki wg lokalu / magazynu</h2></div>${bars(tickets,'location')}</section></div><p class="report-copy">Krytyczne = otwarte zgłoszenia z wysokim alertem lub blokadą sprzedaży. Czas realizacji liczony w godzinach kalendarzowych. Raport obejmuje wszystkie lokalnie zapisane zgłoszenia pasujące do filtrów, bez limitu 2000 rekordów.</p>`;}

function locationsView(){const edit=state.locations.find(l=>l.mpk===editingLocation);return `<div class="admin-split"><section class="panel table-panel"><div class="block-heading"><h2>${state.locations.length} obiekty · ${state.locations.filter(l=>l.active).length} aktywnych</h2></div><div class="table-scroll"><table><thead><tr><th>MPK / nazwa</th><th>Miasto / lokalizacja</th><th>Typ</th><th>Status</th><th></th></tr></thead><tbody>${state.locations.map(l=>`<tr><td><span class="cell-main">${esc(l.mpk)} · ${esc(l.name)}</span></td><td>${esc(l.city)}<span class="cell-sub">${esc(l.location||l.city)}</span></td><td>${esc(l.type)}</td><td><span class="pill ${l.active?'closed':'rejected'}">${l.active?'Aktywny':'Nieaktywny'}</span></td><td><button class="btn secondary small" data-action="edit-location" data-id="${esc(l.mpk)}">Edytuj</button></td></tr>`).join('')}</tbody></table></div></section><form id="location-form" class="panel admin-form"><h3>${edit?'Edytuj obiekt':'Dodaj obiekt'}</h3><input type="hidden" name="original" value="${esc(edit?.mpk||'')}"><div class="field"><label for="l-mpk">Numer MPK</label><input id="l-mpk" name="mpk" required maxlength="40" value="${esc(edit?.mpk||'')}" ${edit?'readonly':''}></div><div class="field"><label for="l-name">Nazwa</label><input id="l-name" name="name" required maxlength="150" value="${esc(edit?.name||'')}"></div><div class="field"><label for="l-city">Miasto</label><input id="l-city" name="city" required maxlength="100" value="${esc(edit?.city||'')}"></div><div class="field"><label for="l-location">Lokalizacja / terminal (opcjonalnie)</label><input id="l-location" name="location" maxlength="150" value="${esc(edit?.location||'')}"></div><div class="field"><label for="l-type">Typ</label><select id="l-type" name="type">${['Lokal','Magazyn'].map(t=>option(t,t,edit?.type||'Lokal')).join('')}</select></div><label class="checkline"><input type="checkbox" name="active" ${edit?.active!==false?'checked':''}> Obiekt aktywny</label><button function settingsView(){return `<div class="admin-split"><form id="settings-form" class="panel admin-form"><h2>Ustawienia aplikacji</h2><div class="form-grid"><div class="field"><label for="s-hours">Próg braku reakcji (godziny)</label><input id="s-hours" name="responseHours" type="number" min="1" max="720" required value="${state.settings.responseHours}"></div><div class="field"><label for="s-count">Maks. załączników na zgłoszenie (1–5)</label><input id="s-count" name="maxFiles" type="number" min="1" max="5" required value="${state.settings.maxFiles}"></div><div class="field"><label for="s-size">Maks. rozmiar pliku (1–10 MB)</label><input id="s-size" name="maxMB" type="number" min="1" max="10" required value="${state.settings.maxMB}"></div><div class="field full"><label for="s-categories">Rodzaje usterek — jeden w wierszu</label><textarea id="s-categories" name="categories" required rows="10">${esc(state.settings.categories.join('\n'))}</textarea><p class="hint">Zmiana listy nie zmienia kategorii w istniejących zgłoszeniach.</p></div></div><button class="btn" type="submit">Zapisz konfigurację</button></form><aside class="panel"><h3>Integracje Microsoft</h3><span class="pill rejected">Niepodłączone</span><p class="report-copy">E-maile, Teams, SharePoint oraz wspólna baza danych wymagają późniejszego wdrożenia. W tej wersji alerty pojawiają się tylko w otwartej aplikacji.</p></aside></div>`;}
function syncClosingFields(){
 const status=$('#m-status')?.value;if(!status)return;
 const ending=status==='Zamknięte'||status==='Odrzucone',rejected=status==='Odrzucone';
 $('#closing-fields').hidden=!ending;
 const field=$('#m-closing');field.disabled=!ending;field.required=ending;
 $('#closing-label').textContent=rejected?'Powód odrzucenia *':'Komentarz zamknięcia *';
 field.placeholder=rejected?'Dlaczego zgłoszenie jest odrzucane?':'Jak rozwiązano problem?';
 $('#closing-hint').textContent=rejected?'Podaj krótko powód odrzucenia.':'Krótko opisz wykonane prace.';
 const submit=$('#manage-submit');submit.textContent=ending?(rejected?'Potwierdź odrzucenie':'Potwierdź zamknięcie'):'Zapisz zmiany';
 submit.classList.toggle('danger',rejected);
}
function inputDate(iso){if(!iso)return '';const d=new Date(iso);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}
function detailView(t){const comments=state.comments.filter(c=>c.ticketId===t.id).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));const assignee=state.users.find(u=>u.id===t.assigneeId);return `<div class="dialog-head"><div><p>${esc(t.city)} · ${esc(t.mpk)} · ${esc(t.locationName)}</p><h2 id="dialog-title">${esc(t.number)}</h2>${statusPill(t.status)} ${priorityPill(t.priority)}${t.blocksSales?' <span class="pill high">Blokuje sprzedaż</span>':''}</div><button class="close-dialog" data-action="close-dialog" aria-label="Zamknij szczegóły">✕</button></div><div class="dialog-body"><div class="detail-grid"><div><section class="panel"><h3>${esc(t.category)}</h3><p class="detail-description">${esc(t.description)}</p><dl class="detail-meta"><div><dt>Zgłaszający</dt><dd>${esc(t.reporter)}</dd></div><div><dt>Data zgłoszenia</dt><dd>${date(t.createdAt)}</dd></div><div><dt>E-mail profilu</dt><dd>${esc(t.reporterEmail)}</dd></div><div><dt>Koordynator</dt><dd>${esc(assignee?.name||'Nie przypisano')}</dd></div><div><dt>Termin realizacji</dt><dd class="${Model.overdue(t)?'danger-text':''}">${date(t.dueAt)}</dd></div>${t.closedAt?`<div><dt>Data zakończenia</dt><dd>${date(t.closedAt)}</dd></div>`:''}</dl>${t.closingComment?`<div class="summary-box"><strong>${t.status==='Odrzucone'?'Powód odrzucenia':'Komentarz zamknięcia'}</strong><p class="detail-description">${esc(t.closingComment)}</p></div>`:''}<h3>Załączniki (${t.attachments.length})</h3>${t.attachments.length?t.attachments.map(f=>`<div class="file-row">${icon('clip')}<span class="file-name">${esc(f.name)}<br><small>${sizeFmt(f.size)}</small></span><button class="btn secondary small" data-action="download-file" data-id="${esc(f.id)}">Pobierz</button></div>`).join(''):'<p class="report-copy">Nie dodano załączników.</p>'}</section><section class="panel space-top"><h3>Komentarze (${comments.length})</h3>${comments.map(c=>`<article class="comment"><div class="comment-top"><strong>${esc(c.authorName)} · ${esc(c.role)}</strong><time>${date(c.createdAt)}</time></div><p>${esc(c.text)}</p></article>`).join('')||'<p class="report-copy">Brak komentarzy. Dodaj informacje o usterce lub postępie naprawy.</p>'}<form id="comment-form" class="comment-form"><label class="sr-only" for="comment-text">Treść komentarza</label><textarea id="comment-text" name="text" maxlength="5000" required placeholder="Dodaj komentarz…"></textarea><button class="btn" type="submit">Dodaj komentarz</button></form></section></div><aside>${canManage()&&!Model.closed(t)?`<form id="manage-form" class="panel detail-control"><h3>Obsługa zgłoszenia</h3><div class="field"><label for="m-status">Status</label><select id="m-status" name="status">${Model.statuses.map(s=>option(s,s==='Zamknięte'?'Zamknij zgłoszenie':s==='Odrzucone'?'Odrzuć zgłoszenie':s,t.status)).join('')}</select></div><div class="field"><label for="m-priority">Poziom alertu</label><select id="m-priority" name="priority">${Model.priorities.map(p=>option(p,p,t.priority)).join('')}</select></div><div class="field"><label for="m-assignee">Przypisz osobę</label><select id="m-assignee" name="assigneeId">${option('','Nie przypisano',t.assigneeId)}${state.users.filter(u=>u.active&&u.role!=='Użytkownik').map(u=>option(u.id,u.name,t.assigneeId)).join('')}</select></div><div class="field"><label for="m-due">Termin realizacji</label><input id="m-due" type="datetime-local" name="dueAt" value="${inputDate(t.dueAt)}"><p class="hint">Czas lokalny tego urządzenia.</p></div><div id="closing-fields" class="closing-fields" hidden><div class="field"><label id="closing-label" for="m-closing">Komentarz</label><textarea id="m-closing" name="closingComment" maxlength="5000" rows="3" disabled aria-describedby="closing-hint"></textarea><p class="hint" id="closing-hint"></p></div><p class="closing-warning">Po zatwierdzeniu dane obsługi zostaną zablokowane. Nadal będzie można dodawać komentarze.</p></div><button id="manage-submit" class="btn" type="submit">Zapisz zmiany</button></form>`:`<section class="panel"><div class="info-mark">${icon(Model.closed(t)?'check':'clock')}</div><h3>${Model.closed(t)?'Zgłoszenie zakończone':'Śledź postęp naprawy'}</h3><p class="report-copy">${Model.closed(t)?'Dane obsługi zostały zamknięte. Możesz nadal dodać komentarz.':'Status i termin uzupełnia koordynator. Możesz dodawać komentarze i pobierać załączniki.'}</p></section>`}</aside></div></div>`;}
function openDetail(id){const t=currentTickets().find(t=>t.id===id);if(!t)throw Error('Zgłoszenie nie jest dostępne w tym profilu.');selectedTicket=id;detailDirty=false;const dialog=$('#detail-dialog');dialog.innerHTML=detailView(t);if(!dialog.open)dialog.showModal();}

function exportCsv(form){if(!isAdmin())throw Error('Wybierz profil administratora.');const v=Object.fromEntries(new FormData(form));if(v.from&&v.to&&v.from>v.to)throw Error('Data początkowa nie może być późniejsza niż końcowa.');const tickets=state.tickets.filter(t=>(!v.from||t.createdAt>=new Date(v.from+'T00:00').toISOString())&&(!v.to||t.createdAt<=new Date(v.to+'T23:59:59.999').toISOString()));const rows=[['Numer zgłoszenia','Data zgłoszenia','Miasto','MPK','Nazwa','Zgłaszający','E-mail','Rodzaj','Alert','Blokuje sprzedaż','Opis','Status','Koordynator','Termin realizacji','Data zamknięcia','Komentarz zamknięcia','Pierwsza reakcja','Załączniki']];for(const t of tickets)rows.push([t.number,date(t.createdAt),t.city,t.mpk,t.locationName,t.reporter,t.reporterEmail,t.category,t.priority,t.blocksSales?'Tak':'Nie',t.description,t.status,state.users.find(u=>u.id===t.assigneeId)?.name||'',t.dueAt?date(t.dueAt):'',t.closedAt?date(t.closedAt):'',t.closingComment,t.firstResponseAt?date(t.firstResponseAt):'',t.attachments.map(f=>f.name).join(' | ')]);download(new Blob(['\uFEFF'+rows.map(r=>r.map(Model.csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'Baltona-zgloszenia-'+new Date().toISOString().slice(0,10)+'.csv');toast('Przygotowano raport: '+tickets.length+' zgłoszeń.');}
async function backup(){if(!isAdmin())throw Error('Wybierz profil administratora.');toast('Przygotowuję kopię danych i załączników…');const snapshot=await new Promise((resolve,reject)=>{const tx=db.transaction(['state','files']);const a=tx.objectStore('state').get('main'),b=tx.objectStore('files').getAll();tx.oncomplete=()=>resolve({state:a.result,files:b.result});tx.onerror=()=>reject(tx.error);});const files=[];for(const f of snapshot.files){const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(f.blob);});const {blob,...meta}=f;files.push({...meta,base64});}const data={format:'baltona-usterki-backup',version:1,exportedAt:new Date().toISOString(),state:snapshot.state,files};download(new Blob([JSON.stringify(data)],{type:'application/json'}),'Baltona-kopia-'+new Date().toISOString().slice(0,10)+'.json');toast('Przygotowano pełną kopię. Zachowaj pobrany plik w bezpiecznym miejscu.');}
async function restore(file){if(!isAdmin())throw Error('Wybierz profil administratora.');if(!file)return;if(file.size>250*1024*1024&&!confirm('To duża kopia danych. Jej wczytanie może wymagać dużo pamięci przeglądarki. Kontynuować?'))return;const data=JSON.parse(await file.text());const next=Model.validateBackup(data);const files=[];for(const f of data.files){const raw=atob(f.base64);if(raw.length!==f.size)throw Error('Niezgodny rozmiar załącznika w kopii.');const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const blob=new Blob([bytes],{type:f.type});const b=new Uint8Array(await blob.slice(0,8).arrayBuffer());const valid=f.type==='image/jpeg'?b[0]===255&&b[1]===216&&b[2]===255:f.type==='image/png'?[137,80,78,71,13,10,26,10].every((v,i)=>b[i]===v):String.fromCharCode(...b.slice(0,5))==='%PDF-';if(!valid)throw Error('Nieprawidłowa zawartość załącznika w kopii.');const {base64,...meta}=f;files.push({...meta,blob});}if(!confirm('Wczytać '+next.tickets.length+' zgłoszeń i '+files.length+' załączników? Zastąpi to CAŁĄ bieżącą lokalną bazę, w tym profile i obiekty. Najpierw pobierz kopię obecnych danych.'))return;await persist(structuredClone(next),files,true);currentId=state.users.find(u=>u.active&&u.role==='Administrator').id;savePreference();selectedTicket=null;editingUser=null;editingLocation=null;dirty=false;page='admin';adminTab='reports';pendingRemote=null;lastSeenProfile=null;shell();announceProfile();toast('Wczytano i zapisano pełną kopię danych.');}

 if(lastSeenProfile!==currentId){lastSeenProfile=currentId;seenNotificationIds=new Set(all.map(n=>n.id));return;}

function ingestRemote(latest,announce=true){

 if((dirty||detailDirty)&&Model.businessChanged(state,latest)){
   const first=!pendingRemote;pendingRemote=latest;refreshNotificationsUI();if(first)toast('W innej karcie zmieniono dane. Twój formularz pozostaje bez zmian; odśwież dane przed zapisem.',true);if(announce)noticeFresh(latest);return;

 try{const latest=await requestValue(db.transaction('state').objectStore('state').get('main'));if(!busy&&latest&&latest.revision>state.revision)ingestRemote(latest);}

 await new Promise((resolve,reject)=>{const tx=db.transaction('state','readwrite'),store=tx.objectStore('state'),req=store.get('main');

 else if(form.id==='settings-form'){await submitSettings(form);dirty=false;}
 else if(form.id==='export-form')exportCsv(form);
 else if(form.id==='filter-form'){const v=Object.fromEntries(new FormData(form));if(v.from&&v.to&&v.from>v.to)throw Error('Data początkowa nie może być późniejsza niż końcowa.');filters={q:v.q.trim(),status:v.status,city:v.city,priority:v.priority,from:v.from||'',to:v.to||''};shell();}
 }catch(error){fail(error,form);}finally{busy=false;buttons.forEach(b=>b.disabled=false);}});
document.addEventListener('change',async event=>{const el=event.target;if(!state)return;
 if(el.id==='profile-select'){if(busy){el.value=currentId;return;}if((dirty||detailDirty)&&!confirm('Zmiana profilu odrzuci niezapisany formularz. Kontynuować?')){el.value=currentId;return;}currentId=el.value;savePreference();dirty=false;detailDirty=false;lastSeenProfile=null;draftFiles=[];editingUser=null;editingLocation=null;if($('#detail-dialog').open)$('#detail-dialog').close();if(page==='admin'&&!isAdmin())page='home';filters={q:'',status:'',city:'',priority:'',from:'',to:''};if(pendingRemote){state=pendingRemote;pendingRemote=null;currentId=user().id;}shell();toast('Widok testowy: '+user().role+'. To nie jest logowanie.');announceProfile();}
 if(el.id==='m-status'){detailDirty=true;syncClosingFields();}
 if(el.id==='city'){const choices=state.locations.filter(l=>l.active&&l.city===el.value);$('#mpk').disabled=!el.value;$('#mpk').innerHTML=option('','Wybierz lokal / magazyn')+choices.map(l=>option(l.mpk,l.mpk+' · '+l.name+(l.type==='Magazyn'?' [Magazyn]':'')+(l.location&&l.location!==l.city?' · '+l.location:''))).join('');}
 if(el.id==='attachments'){await perform(()=>addFiles(el.files));el.value='';}
 if(el.id==='restore-file'){await perform(()=>restore(el.files[0]));el.value='';}
});
document.addEventListener('input',event=>{if(event.target.closest('#new-form,#user-form,#location-form,#settings-form'))dirty=true;if(event.target.closest('#manage-form,#comment-form'))detailDirty=true;});
document.addEventListener('dragover',event=>{const zone=event.target.closest('#dropzone');if(zone){event.preventDefault();zone.classList.add('drag');}});
document.addEventListener('dragleave',event=>{event.target.closest('#dropzone')?.classList.remove('drag');});
document.addEventListener('drop',async event=>{const zone=event.target.closest('#dropzone');if(zone){event.preventDefault();zone.classList.remove('drag');await perform(()=>addFiles(event.dataTransfer.files));}});
window.addEventListener('beforeunload',event=>{if(dirty||detailDirty||busy){event.preventDefault();event.returnValue='';}});
$('#detail-dialog').addEventListener('close',()=>{selectedTicket=null;detailDirty=false;});
$('#detail-dialog').addEventListener('cancel',event=>{if(busy||(detailDirty&&!confirm('Odrzucić niezapisane zmiany w zgłoszeniu?')))event.preventDefault();else detailDirty=false;});
openStore().then(()=>initializeAuth()).then(()=>{if(authUser){showApp();announceProfile();startLiveSync();}}).catch(error=>{showAuth(error.message);});

</script>
</body>
</html>
