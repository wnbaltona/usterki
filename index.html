.sidebar{width:218px;padding:0 14px 22px;background:var(--navy);color:#e6f0f2}
.brand{display:flex;align-items:center;gap:11px;min-height:76px;padding:18px 9px;border-bottom:1px solid #ffffff2f;color:#fff;font-size:21px;line-height:1.1;letter-spacing:-.35px}

.main-wrap{margin-left:218px;background:var(--bg)}

.profile{gap:9px}
.role-switch{display:flex;align-items:center;gap:8px}

.role-switch select{height:37px;min-height:37px;max-width:260px;padding:7px 28px 7px 10px;border:1px solid #cedde0;border-radius:6px;background:#fff;color:#304955;font-size:13px}
.notification-bell,.logout-button{height:37px;min-height:37px;border:1px solid #cedde0;border-radius:6px;background:#fff;color:#386c78}
.notification-bell:hover{background:#f1f7f7}
.notification-bell svg{width:18px;height:18px}
.content{width:100%;max-width:1510px;margin:0 auto;padding:30px clamp(22px,3vw,44px) 44px}
.heading{align-items:center;gap:18px;margin-bottom:21px}
.heading h1{margin:0;color:#253d49;font-size:24px;font-weight:720;line-height:1.25;letter-spacing:-.45px}
.heading p:not(.eyebrow){margin:4px 0 0;color:#647b86;font-size:13px}
.btn{min-height:39px;padding:9px 15px;border:1px solid var(--teal);border-radius:6px;background:var(--teal);color:#fff;font-size:13px;font-weight:650;box-shadow:none}
.btn:hover{border-color:#28666e;background:#28666e}
.btn.secondary{border-color:#cbdcdf;background:#fff;color:#315e6b}
.btn.secondary:hover{border-color:#a9c9ce;background:#f3f8f8}
.btn.danger{border-color:#e8cbcf;background:#fff9f9;color:var(--red)}
.btn.small{min-height:32px;padding:6px 10px;font-size:12px}
.panel{border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:0 2px 11px #1f3c4906}
.panel h2{font-size:18px}.panel h3{font-size:16px}
.home-toolbar{display:grid;grid-template-columns:minmax(180px,1fr) auto auto;align-items:center;gap:25px;min-height:62px;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.home-toolbar h1{margin:0;color:#253d49;font-size:24px;line-height:1.2;font-weight:720;letter-spacing:-.45px}
.home-toolbar>.btn{justify-self:end}
.home-toolbar .home-summary{display:flex;align-items:center;justify-content:center;gap:23px;margin:0;padding:0;border:0;background:transparent;overflow:visible}
.home-toolbar .home-summary>div{display:flex;align-items:baseline;gap:5px;min-height:0;padding:0;border:0!important;border-radius:0;background:transparent;box-shadow:none;white-space:nowrap}
.home-toolbar .home-summary>div::before{display:none}
.home-toolbar .home-summary span{color:#576e7b;font-size:13px;font-weight:600}
.home-toolbar .home-summary strong{color:#263e49;font-size:15px;font-weight:750;font-variant-numeric:tabular-nums}
.home-toolbar .home-summary .attention strong{color:#287454}
.recent-panel .block-heading,.table-panel .block-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:61px;margin:0;padding:14px 19px;border-bottom:1px solid #e7edef}
.recent-panel .block-heading h2{margin:0;color:#2d4754;font-size:16px;font-weight:700}
.recent-panel .block-heading .btn{min-height:34px}
.table-panel,.city-group .table-panel{padding:0;overflow:hidden;border-radius:9px}
.table-scroll{width:100%;overflow-x:auto}
.tickets-table{width:100%;border-collapse:collapse}
.tickets-table thead{background:#f7f9f9;color:#5c7380;text-transform:none;letter-spacing:0}
.tickets-table th{padding:13px 14px;color:#5c7380;font-size:12px;font-weight:700;white-space:nowrap}
.tickets-table td{padding:14px;border-top:1px solid #e9eff0;font-size:13px;line-height:1.45;vertical-align:middle}
.tickets-table tbody tr:nth-child(even){background:#fcfdfd}
.tickets-table tbody tr:hover{background:#f3f8f8}
.tickets-table .cell-main{color:#29424f;font-size:13px;font-weight:650}
.tickets-table .cell-sub{display:block;margin-top:4px;color:#677e8a;font-size:12px;line-height:1.4}
.tickets-table .cell-description{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ticket-number{display:block;color:#2f6876;font-size:13px;font-weight:750;font-variant-numeric:tabular-nums}
.ticket-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.quick-close-btn{border-color:#c4dadd;background:#edf6f6;color:#2e6b73}
.quick-close-btn:hover{border-color:#a2c7cc;background:#e6f2f2}
.pill{display:inline-block;padding:4px 8px;border:1px solid transparent;border-radius:5px;font-size:12px;line-height:1.25;font-weight:650;white-space:nowrap}
.pill.new{border-color:#cde2e8;background:#eaf4f7;color:#2c6b80}
.pill.progress{border-color:#e9ddbd;background:#fbf5e8;color:#89682a}
.pill.closed{border-color:#cce3d5;background:#edf7f0;color:#2c7453}
.pill.rejected{border-color:#dce3e6;background:#f2f4f5;color:#6b7980}
.pill.high{border-color:#ecd4d7;background:#fcf0f1;color:#a64751}
.pill.medium{border-color:#eadfca;background:#fbf6eb;color:#89682a}
.pill.low{border-color:#d2e5d8;background:#eef7f0;color:#357453}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px;border:0;border-radius:0;background:transparent;overflow:visible}
.stats .stat,.stats .stat:last-child{min-height:86px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 2px 10px #1f3c4905}
.stats .stat:hover{background:#f8fbfb}
.stats .stat.selected{border-color:#79aeb4;background:#f0f7f7;box-shadow:inset 0 3px #4a9299}
.stats .stat.selected .stat-label,.stats .stat.selected strong{color:#2d6f78}
.stat-label{color:#526c79;font-size:12px;font-weight:650}
.stat strong{margin-top:7px;color:#263e49;font-size:26px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.stat.alert strong{color:#a64751}
.filters{gap:11px;margin-bottom:16px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 2px 9px #1f3c4904}
.filters .field{min-width:140px}.simple-filters .search-field{flex:1 1 350px;min-width:220px}
.filters label{margin-bottom:6px;color:#506b79;font-size:12px;font-weight:650}
.simple-filters>.btn{height:39px}
.more-filters{width:100%;padding-top:2px}
.more-filters summary{display:inline-block;color:#306d78;font-size:12px;font-weight:650;cursor:pointer;list-style:none}
.more-filters summary::-webkit-details-marker{display:none}
.more-filters summary::after{content:'⌄';display:inline-block;margin-left:7px;transition:transform .15s}
.more-filters[open] summary::after{transform:rotate(180deg)}
.more-filters-grid{display:grid;grid-template-columns:repeat(2,minmax(180px,250px));gap:12px;margin-top:12px;padding-top:13px;border-top:1px solid var(--line)}
input:not([type=radio]):not([type=checkbox]),select,textarea{min-height:42px;padding:9px 12px;border:1px solid #c8d9de;border-radius:6px;background:#fff;color:#263f4c;font-size:14px}
input::placeholder,textarea::placeholder{color:#8699a2}
input:not([type=radio]):not([type=checkbox]):hover,select:hover,textarea:hover{border-color:#9cbec5}
input:not([type=radio]):not([type=checkbox]):focus,select:focus,textarea:focus{border-color:#6aa5ad;box-shadow:0 0 0 3px #e4f1f2;outline:none}
.city-filters{gap:0;margin:6px 0 20px;padding:0;border-bottom:1px solid var(--line)}
.city-chip,.city-chip:hover,.city-chip.active{min-height:40px;margin-right:22px;padding:8px 1px;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:#5d7480;font-size:12px;font-weight:650}
.city-chip:hover{border-bottom-color:#a8c9cd;color:#306d78}
.city-chip.active{border-bottom-color:#327981;color:#2d6972}
.city-chip span,.city-chip.active span{height:auto;background:transparent;color:#7c919a;font-size:11px}
.city-group{margin-bottom:24px}
.city-group-heading{margin:0 0 10px;padding:0 2px}
.city-group-heading h2{color:#293f4b;font-size:16px}
.city-group-kicker,.city-group-count{color:#71858f;font-size:11px}
.content[data-page="new"]>.heading{width:100%;max-width:940px;margin:0 auto 18px}
.form-layout.simple-form{display:block;width:100%;max-width:940px;margin:0 auto}
.simple-form>.panel{width:100%;max-width:none;padding:29px 32px}
.section-title{margin-bottom:20px}.section-title.separated{margin-top:27px;padding-top:25px;border-color:var(--line)}
.section-title .num{display:grid;place-items:center;flex:none;width:32px;height:32px;border:1px solid #cfe3e6;border-radius:7px;background:#eaf3f4;color:#2e7580;font-size:12px}
.section-title h2{color:#2b4450;font-size:18px;font-weight:700}
.form-grid{gap:18px 20px}.form-grid>.field{min-width:0}
.field label,.field-label{margin-bottom:7px;color:#344e5b;font-size:13px;font-weight:650}
.simple-form textarea{min-height:112px}
.priority-choice,.checkline{border-radius:6px;font-size:13px}
.priority-choice:has(input:checked){border-color:#86b7bc;background:#f0f7f7}
.simple-form .form-grid+.dropzone{margin-top:20px}
.dropzone{border-color:#adcad0;border-radius:7px;background:#f8fbfb}
.dropzone:hover{border-color:#78a8af;background:#f1f8f8}
.dropzone strong{color:#2d6370;font-size:13px}.dropzone p,.hint,.optional-label{color:#657c87;font-size:12px}
.form-bottom{margin-top:23px;padding-top:20px;border-color:var(--line)}
.admin-tabs{border-bottom-color:var(--line)}
.tab-button,.tab-button.active{font-size:13px}
.tab-button.active{border-bottom-color:#327981;color:#2e6f78}
.admin-split{grid-template-columns:minmax(0,1fr) 340px;gap:19px}
.metric-strip,.chart-grid{gap:16px}
.bar-fill{background:#6aa3a9}
dialog{border:1px solid #cedee2;border-radius:10px;background:#f6f9f9;box-shadow:0 25px 80px #142e3b36}
.dialog-head{padding:19px 24px;border-bottom:1px solid var(--line);background:#fff}
.dialog-head h2{color:#284551;font-size:24px}.dialog-head p{color:#647b87;font-size:13px}
.dialog-body{padding:21px}.detail-grid{gap:18px}.detail-grid .panel{padding:21px}
.detail-description{color:#354e5b;font-size:14px;line-height:1.7}
.detail-meta{gap:14px 18px}.detail-meta dt{color:#718690;font-size:12px}.detail-meta dd{color:#2d4754;font-size:13px}
.detail-control{gap:15px}.detail-status-panel{border-color:#d3e5e3;background:#f8fbfa}
.summary-box{border-left-color:#6ca3a8;background:#eef6f6}
.activity-panel{background:#fbfdfd}.activity-panel h3{margin-bottom:12px}
.activity-item{display:grid;grid-template-columns:115px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.activity-item:first-of-type{border-top:0}.activity-date{color:#748994;font-size:12px;white-space:nowrap}
.activity-item strong{color:#2b4450;font-size:13px}.activity-item p{margin:3px 0 0;color:#607783;line-height:1.5;overflow-wrap:anywhere}
.manager-close{width:100%;margin-top:14px}
.footer{margin:0 30px;padding:14px 0;border-top:1px solid var(--line);color:#788d97;font-size:11px}
.auth-screen .content{background:#f0f5f5}.auth-card{border-color:#d9e5e7;border-radius:10px;box-shadow:0 18px 50px #183d4915}
.auth-brand .brand-mark{display:grid;background:#315766;color:#fff}
@media(max-width:1220px){.sidebar{width:202px}.main-wrap{margin-left:202px}.content{padding:25px 23px 36px}.topbar{padding:9px 23px}.admin-split{grid-template-columns:minmax(0,1fr) 300px}}

@media(max-width:560px){.sidebar{padding:9px 11px}.brand{font-size:17px}.nav-button{font-size:11px}.nav-button .icon{display:none}.topbar{padding:8px 12px}.role-switch label{display:none}.role-switch select{max-width:175px;font-size:12px}.content{padding:17px 12px 28px}.heading h1,.home-toolbar h1{font-size:20px}.home-toolbar{grid-template-columns:1fr auto;gap:10px}.home-toolbar>.btn{padding:7px 10px;font-size:11px}.home-toolbar .home-summary{gap:11px;overflow-x:auto}.home-toolbar .home-summary span,.home-toolbar .home-summary strong{font-size:11px}.recent-panel .block-heading,.table-panel .block-heading{padding:12px 13px}.recent-panel .block-heading h2{font-size:14px}.recent-panel .block-heading .btn{min-height:31px;padding:6px 9px;font-size:11px}.stats{display:flex;overflow-x:auto}.stats .stat,.stats .stat:last-child{flex:0 0 112px;min-height:70px}.stat strong{font-size:23px}.simple-filters .search-field{flex-basis:100%}.simple-filters>.btn{flex:1}.more-filters-grid{grid-template-columns:1fr}.simple-form>.panel{padding:19px 15px}.simple-form .form-grid{grid-template-columns:1fr;gap:16px}.simple-form .form-grid>.full{grid-column:auto}.simple-form .priority-options{grid-template-columns:repeat(3,minmax(0,1fr))}.activity-item{grid-template-columns:1fr;gap:2px}.activity-date{white-space:normal}}


.detail-status-panel{display:block;min-width:0}
.progress-head{display:flex;align-items:flex-start;gap:12px;min-width:0}
.progress-head .info-mark{display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;margin:0;border-radius:8px;background:#e6f1f1;color:#2f7480}
.progress-head>div{min-width:0}
.progress-head h3{margin:0 0 5px;color:#29434f;font-size:16px;line-height:1.3}
.progress-head p{margin:0;color:#5b7380;font-size:12px;line-height:1.5}
.progress-head .pill{vertical-align:middle}
.progress-steps{display:grid;gap:0;margin:19px 0 16px;padding:0;list-style:none}
.progress-step{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;min-height:54px;align-items:start}
.progress-step:not(:last-child)::after{content:"";position:absolute;top:26px;bottom:0;left:13px;width:2px;background:#dce8e9}
.progress-step.complete:not(:last-child)::after{background:#9cc6c8}
.progress-step-mark{display:grid;place-items:center;width:28px;height:28px;border:1px solid #cddbdd;border-radius:50%;background:#fff;color:#81959d;font-size:12px;font-weight:700;line-height:1}
.progress-step.complete .progress-step-mark{border-color:#8fbfc2;background:#e9f5f4;color:#2e7880}
.progress-step strong{display:block;padding-top:2px;color:#354d58;font-size:13px;font-weight:650;line-height:1.35}
.progress-step small{display:block;margin-top:3px;color:#6b818b;font-size:12px;line-height:1.35}
.progress-step.pending strong{color:#748993}
.progress-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0;padding:13px 0 0;border-top:1px solid var(--line)}
.progress-meta>div{min-width:0}
.progress-meta dt{margin:0 0 4px;color:#6d818b;font-size:11px}
.progress-meta dd{margin:0;color:#2f4855;font-size:12px;font-weight:600;overflow-wrap:anywhere}
.detail-status-panel .manager-close{display:flex;grid-column:1/-1;justify-self:stretch;align-items:center;justify-content:center;width:100%;min-width:0;min-height:41px;margin:17px 0 0;padding:9px 12px;white-space:normal;text-align:center;overflow-wrap:anywhere}
.detail-grid.closed-layout .progress-steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:14px 0 10px}
.detail-grid.closed-layout .progress-step{min-height:0}
.detail-grid.closed-layout .progress-step::after{display:none}
@media(max-width:560px){.progress-meta{grid-template-columns:1fr}.detail-grid.closed-layout .progress-steps{grid-template-columns:1fr}.detail-grid.closed-layout .progress-step{min-height:48px}}

  function migrate(state) {
    // Zachowaj zgłoszenia i pliki przy uzupełnianiu starszej bazy.
    if (state.notifications === undefined) state.notifications = [];

    }
    if (!state.users.some(u=>u.id==='demo-manager'||u.email==='kierownik178@example.test')) state.users.push({id:'demo-manager',name:'Kierownik lokalu 178',email:'kierownik178@example.test',role:'Kierownik lokalu',mpks:['178'],active:true});
    const knownEvents = new Set(state.events.map(event => event.id));
    for (const ticket of state.tickets) {

      if (!knownEvents.has(id)) state.events.push({id,ticketId:ticket.id,actorId:ticket.creatorId,actorName:state.users.find(u=>u.id===ticket.creatorId)?.name||ticket.reporter,type:'created',text:'Utworzono zgłoszenie',createdAt:ticket.createdAt});

 return `<div class="stats ${interactive?'':'static-stats'}" aria-label="${interactive?'Filtry zgłoszeń':'Podsumowanie zgłoszeń'}">${cards.map(([key,label,n,ic])=>{const content=`<span class="stat-top"><span class="stat-label">${label}</span>${icon(ic)}</span><strong>${n}</strong>`;const selected=key==='critical'?filters.quick==='critical':key==='progress'?filters.quick==='active':key==='all'?!filters.status&&!filters.quick:filters.status===({new:'Nowe',closed:'Zamknięte'}[key])&&!filters.quick;return interactive?`<button type="button" class="stat ${key==='critical'?'alert':''} ${selected?'selected':''}" aria-pressed="${selected}" data-action="stat-filter" data-filter="${key}" aria-label="Pokaż ${label.toLowerCase()}: ${n}">${content}<span class="stat-link">Pokaż zgłoszenia <span aria-hidden="true">→</span></span></button>`:`<div class="stat ${key==='critical'?'alert':''}">${content}</div>`}).join('')}</div>`;
}
function ticketTable(tickets,limit=0,showCount=true){if(!tickets.length)return empty('Brak zgłoszeń','Pierwsze zgłoszenie pojawi się tutaj po wysłaniu formularza.',btn('new','Zgłoś usterkę'));
 const managerTickets=page==='tickets'&&user().role==='Kierownik lokalu';const mode=page==='tickets'?(filters.sort||'urgent'):'urgent';const sorted=[...tickets].sort((a,b)=>{if(mode==='urgent'){const diff=priorityScore(b)-priorityScore(a);if(diff)return diff;}const byDate=b.createdAt.localeCompare(a.createdAt);return (mode==='oldest'?-byDate:byDate)||a.number.localeCompare(b.number);});const rows=limit?sorted.slice(0,limit):sorted;
 return `<div class="table-scroll"><table class="tickets-table"><thead><tr><th>Numer / data</th><th>${managerTickets?'Lokal':'Lokal / miasto'}</th><th>Rodzaj usterki</th><th>Priorytet</th><th>Status</th><th>Termin</th><th scope="col">Działania</th></tr></thead><tbody>${rows.map(t=>`<tr><td data-label="Zgłoszenie"><strong class="ticket-number">${esc(t.number)}</strong><span class="cell-sub">${date(t.createdAt)}</span></td><td data-label="Obiekt"><span class="cell-main">${esc(t.mpk)} · ${esc(t.locationName)}</span>${managerTickets?'':`<span class="cell-sub">${esc(ticketCity(t))}${t.location&&t.location!==ticketCity(t)?' · '+esc(t.location):''}</span>`}</td><td data-label="Usterka"><span class="cell-main">${esc(t.category)}</span></td><td data-label="Alert">${priorityPill(t.priority)}${t.blocksSales?'<span class="cell-sub danger-text">Blokuje sprzedaż</span>':''}</td><td data-label="Status">${statusPill(t.status)}</td><td data-label="Termin">${dueCell(t)}</td><td data-label="Działanie"><div class="ticket-actions"><button class="btn secondary small" data-action="detail" data-id="${esc(t.id)}" aria-label="Szczegóły ${esc(t.number)}">Otwórz</button>${canClose(t)&&!Model.closed(t)?`<button class="btn quick-close-btn small" type="button" data-action="quick-close" data-id="${esc(t.id)}" aria-label="Szybko zamknij ${esc(t.number)}">Zamknij</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>${!limit&&showCount?`<div class="page-count">Liczba wyników: ${rows.length}</div>`:''}`;
}
function homeView(){const list=currentTickets(),m=Model.metrics(list),cutoff=Date.now()-24*60*60*1000,recent=list.filter(t=>!Model.closed(t)&&Date.parse(t.createdAt)>=cutoff);return `<div class="home-toolbar"><h1>Zgłoszenia</h1><div class="home-summary" aria-label="Podsumowanie zgłoszeń"><div><span>Otwarte</span><strong>${list.filter(t=>!Model.closed(t)).length}</strong></div><div><span>W toku</span><strong>${m.progress}</strong></div><div class="attention"><span>Zamknięte</span><strong>${m.finished}</strong></div></div>${btn('new','Dodaj zgłoszenie')}</div><section class="panel table-panel recent-panel"><div class="block-heading"><h2>Zgłoszenia z ostatnich 24 h</h2><button class="btn secondary" type="button" data-action="nav" data-page="tickets">Wszystkie zgłoszenia <span aria-hidden="true">→</span></button></div>${recent.length?ticketTable(recent,0,false):empty('Brak nowych zgłoszeń','Otwarte zgłoszenia z ostatnich 24 godzin pojawią się tutaj. Starsze znajdziesz w sekcji Wszystkie zgłoszenia.')}</section>`;}
function newView(){const places=availablePlaces(),cities=[...new Set(places.map(l=>l.city))].sort((a,b)=>a.localeCompare(b,'pl')),selectedCity=cities.length===1?cities[0]:'',cityPlaces=places.filter(l=>l.city===selectedCity),selectedMpk=cityPlaces.length===1?cityPlaces[0].mpk:'',previous=[...state.tickets].filter(t=>t.creatorId===user().id&&t.reporterPhone).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0];return header('Zgłoś usterkę','Uzupełnij lokalizację, opis i dane kontaktowe.')+`<div class="form-layout simple-form"><form id="new-form" class="panel"><div class="section-title"><span class="num">01</span><div><h2>Lokalizacja usterki</h2></div></div><div class="form-grid"><div class="field"><label for="city">Miasto <span class="required">*</span></label><select id="city" name="city" required><option value="">Wybierz miasto</option>${cities.map(c=>option(c,c,selectedCity)).join('')}</select></div><div class="field"><label for="mpk">Lokal lub magazyn <span class="required">*</span></label><select id="mpk" name="mpk" required ${selectedCity?'':'disabled'}>${selectedCity?option('','Wybierz lokal / magazyn')+cityPlaces.map(l=>option(l.mpk,l.mpk+' · '+l.name+(l.type==='Magazyn'?' [Magazyn]':'')+(l.location&&l.location!==l.city?' · '+l.location:''),selectedMpk)).join(''):option('','Najpierw wybierz miasto')}</select></div></div><div class="section-title separated"><span class="num">02</span><div><h2>Szczegóły usterki</h2></div></div><div class="form-grid"><div class="field full"><label for="category">Rodzaj usterki <span class="required">*</span></label><select id="category" name="category" required><option value="">Wybierz rodzaj usterki</option>${state.settings.categories.map(c=>option(c)).join('')}</select></div><div class="field full"><label for="description">Opis usterki <span class="required">*</span></label><textarea id="description" name="description" minlength="10" maxlength="10000" required placeholder="Opisz objawy usterki i dokładne miejsce jej występowania." rows="5"></textarea></div><fieldset class="full" style="border:0;padding:0;margin:0"><legend class="field-label">Priorytet zgłoszenia <span class="required">*</span></legend><div class="priority-options">${Model.priorities.map((p,i)=>`<label class="priority-choice ${i===1?'medium':i===2?'high':''}"><input type="radio" name="priority" value="${p}" ${i===1?'checked':''}><i aria-hidden="true"></i>${p}</label>`).join('')}</div></fieldset><div class="full checkline"><input id="blocksSales" name="blocksSales" type="checkbox"><label for="blocksSales">Usterka blokuje sprzedaż</label></div>${canManage()?'<p class="priority-target" id="priority-target" aria-live="polite">Proponowany czas realizacji: 24 h od wysłania zgłoszenia.</p>':''}</div><div class="section-title separated"><span class="num">03</span><div><h2>Dane kontaktowe i załączniki</h2></div></div><div class="form-grid"><div class="field"><label for="reporter">Imię i nazwisko <span class="required">*</span></label><input id="reporter" name="reporter" required maxlength="150" autocomplete="name" value="${esc(previous?.reporter||'')}" placeholder="Imię i nazwisko"></div><div class="field"><label for="reporter-phone">Telefon kontaktowy <span class="required">*</span></label><input id="reporter-phone" name="reporterPhone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="30" value="${esc(user().phone||previous?.reporterPhone||'')}" placeholder="+48 123 456 789"></div></div><div class="dropzone" id="dropzone">${icon('clip')}<strong>Dodaj co najmniej jeden załącznik <span class="required">*</span></strong><p>JPG, PNG, PDF · do ${state.settings.maxFiles} plików · maks. ${state.settings.maxMB} MB każdy</p><input id="attachments" type="file" multiple accept=".jpg,.jpeg,.png,.pdf" aria-label="Dodaj wymagany załącznik: zdjęcie lub PDF" aria-required="true" aria-describedby="attachment-error"></div><p id="attachment-error" class="attachment-error" role="alert" hidden>Dodaj co najmniej jeden załącznik.</p><div id="draft-files" aria-live="polite"></div><div class="form-bottom"><span>Pola oznaczone * są wymagane.</span><button class="btn" type="submit">Wyślij zgłoszenie ${icon('arrow')}</button></div></form></div>`;}
function ticketCity(t){return state.locations.find(l=>l.mpk===t.mpk)?.city||t.city||'Inne';}
function filteredTickets({ignoreCity=false,ignoreStatus=false}={}){return currentTickets().filter(t=>(ignoreStatus||!filters.status||(filters.status==='Zamknięte'?Model.closed(t):t.status===filters.status))&&(ignoreStatus||filters.quick!=='critical'||Model.critical(t))&&(ignoreStatus||filters.quick!=='active'||t.status!=='Nowe'&&!Model.closed(t))&&(ignoreCity||!filters.city||ticketCity(t)===filters.city)&&(!filters.priority||t.priority===filters.priority)&&(!filters.q||[t.number,t.previousNumber,t.mpk,t.locationName,t.description,t.category,t.reporter].join(' ').toLocaleLowerCase('pl').includes(filters.q.toLocaleLowerCase('pl')))&&(!filters.from||t.createdAt>=new Date(filters.from+'T00:00').toISOString())&&(!filters.to||t.createdAt<=new Date(filters.to+'T23:59:59.999').toISOString()));}
function filterForm(){const advanced=!!filters.priority||filters.sort!=='urgent',active=!!(filters.q||filters.status||filters.city||filters.priority||filters.quick||filters.sort!=='urgent');return `${filters.quick?`<div class="active-filter">${filters.quick==='critical'?'Pokazujesz zgłoszenia krytyczne':'Pokazujesz zgłoszenia w toku'} <button type="button" data-action="clear-quick">Usuń filtr ×</button></div>`:''}<form id="filter-form" class="filters simple-filters"><div class="field search-field"><label for="filter-q">Szukaj zgłoszenia</label><input id="filter-q" name="q" value="${esc(filters.q)}" placeholder="Numer, lokal lub opis…"></div><button class="btn" type="submit">Szukaj</button>${active?'<button class="btn secondary" type="button" data-action="clear-filters">Wyczyść</button>':''}<details class="more-filters" ${advanced?'open':''}><summary>Więcej filtrów</summary><div class="more-filters-grid"><div class="field"><label for="filter-priority">Priorytet</label><select id="filter-priority" name="priority">${option('','Wszystkie priorytety',filters.priority)}${Model.priorities.map(p=>option(p,p,filters.priority)).join('')}</select></div><div class="field"><label for="filter-sort">Sortuj</label><select id="filter-sort" name="sort">${option('urgent','Według priorytetu',filters.sort||'urgent')}${option('newest','Najnowsze',filters.sort)}${option('oldest','Najstarsze',filters.sort)}</select></div></div></details></form>`;}

function cityFilters(tickets){const groups=new Map();for(const t of tickets)groups.set(ticketCity(t),(groups.get(ticketCity(t))||0)+1);const sorted=[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0],'pl'));return `<div class="city-filters" aria-label="Filtruj według miasta"><button type="button" class="city-chip ${!filters.city?'active':''}" data-action="city-filter" data-city="" aria-pressed="${!filters.city}">Wszystkie miasta <span>${tickets.length}</span></button>${sorted.map(([city,count])=>`<button type="button" class="city-chip ${filters.city===city?'active':''}" data-action="city-filter" data-city="${esc(city)}" aria-pressed="${filters.city===city}">${esc(city)} <span>${count}</span></button>`).join('')}</div>`;}
function cityGroups(tickets){const grouped=new Map();for(const t of tickets){const city=ticketCity(t);if(!grouped.has(city))grouped.set(city,[]);grouped.get(city).push(t);}return [...grouped.entries()].sort((a,b)=>filters.sort==='urgent'?(Math.max(...b[1].map(priorityScore))-Math.max(...a[1].map(priorityScore))||a[0].localeCompare(b[0],'pl')):a[0].localeCompare(b[0],'pl')).map(([city,items])=>`<section class="city-group"><div class="city-group-heading"><div><span class="city-group-kicker">Miasto</span><h2>${esc(city)}</h2></div><span class="city-group-count">${items.length} ${items.length===1?'zgłoszenie':'zgłoszeń'}</span></div><div class="panel table-panel">${ticketTable(items,0,false)}</div></section>`).join('');}
function ticketMonth(value){const day=new Date(value),key=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Warsaw',year:'numeric',month:'2-digit'}).format(day),label=new Intl.DateTimeFormat('pl-PL',{timeZone:'Europe/Warsaw',year:'numeric',month:'long'}).format(day);return {key,label:label.charAt(0).toLocaleUpperCase('pl')+label.slice(1)};}
function monthGroups(tickets){const grouped=new Map();for(const ticket of tickets){const month=ticketMonth(ticket.createdAt);if(!grouped.has(month.key))grouped.set(month.key,{label:month.label,items:[]});grouped.get(month.key).items.push(ticket);}const manager=user().role==='Kierownik lokalu';return [...grouped.entries()].sort((a,b)=>filters.sort==='oldest'?a[0].localeCompare(b[0]):b[0].localeCompare(a[0])).map(([,group])=>`<section class="month-group"><div class="month-group-heading"><h2>${esc(group.label)}</h2><span>${group.items.length} ${group.items.length===1?'zgłoszenie':'zgłoszeń'}</span></div>${manager?`<div class="panel table-panel">${ticketTable(group.items,0,false)}</div>`:cityGroups(group.items)}</section>`).join('');}
function ticketsView(){const tickets=filteredTickets(),manager=user().role==='Kierownik lokalu',cityBase=manager?[]:filteredTickets({ignoreCity:true});return header(canManage()?'Wszystkie zgłoszenia':manager?'Zgłoszenia lokalu':'Moje zgłoszenia','',btn('new','Zgłoś usterkę'))+statsView(currentTickets())+filterForm()+(manager?'':cityFilters(cityBase))+(tickets.length?monthGroups(tickets)+`<div class="page-count city-total">Liczba wyników: ${tickets.length}</div>`:`<section class="panel">${empty('Nie znaleziono zgłoszeń',currentTickets().length?'Zmień filtry lub wyczyść wyszukiwanie.':'Dodaj pierwsze zgłoszenie, aby sprawdzić cały obieg naprawy.',btn('new','Zgłoś usterkę'))}</section>`);}
function bars(tickets,key){const groups=new Map();for(const t of tickets){const label=key==='location'?t.mpk+' · '+t.locationName:key==='city'?ticketCity(t):t[key];groups.set(label,(groups.get(label)||0)+1);}const sorted=[...groups.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'pl'));const max=sorted[0]?.[1]||1;return sorted.length?sorted.map(([label,n])=>`<div class="bar-row"><span class="bar-label">${esc(label)}</span><span class="bar-track" aria-hidden="true"><span class="bar-fill" style="display:block;width:${n/max*100}%"></span></span><strong>${n}</strong></div>`).join(''):'<p class="report-copy">Brak danych do wyświetlenia.</p>';}
function dashboardView(){const tickets=currentTickets();const m=Model.metrics(tickets,Date.now(),state.settings.responseHours);return header('Dashboard','')+statsView(tickets,false)+`<div class="metric-strip"><section class="panel"><h3>Średni czas realizacji</h3><strong>${m.meanHours===null?'—':m.meanHours.toLocaleString('pl-PL',{maximumFractionDigits:1})+' h'}</strong><small>${m.completed} zamkniętych · bez odrzuconych</small></section><section class="panel"><h3>Wymagają reakcji</h3><strong>${m.overdue} <span class="muted" style="font-size:13px">po terminie</span></strong><small>${m.waiting} bez reakcji przez ${state.settings.responseHours} h</small></section></div><div class="chart-grid"><section class="panel"><div class="block-heading"><h2>Usterki wg miasta</h2></div>${bars(tickets,'city')}</section><section class="panel"><div class="block-heading"><h2>Usterki wg rodzaju</h2></div>${bars(tickets,'category')}</section><section class="panel full"><div class="block-heading"><h2>Usterki wg lokalu / magazynu</h2></div>${bars(tickets,'location')}</section></div>`;}

}

function renderDraftFiles(){if(draftFiles.length){document.getElementById('attachment-error').hidden=true;document.getElementById('dropzone').classList.remove('invalid');}if(!$('#draft-files'))return;$('#draft-files').innerHTML=draftFiles.map((f,i)=>`<div class="file-row">${icon('clip')}<span class="file-name">${esc(f.name)} <small>${sizeFmt(f.size)}</small></span><button class="btn secondary small" type="button" data-action="remove-file" data-index="${i}" aria-label="Usuń ${esc(f.name)}">Usuń</button></div>`).join('');}
async function validateFile(file){if(!file.size||file.size>state.settings.maxMB*1024*1024)throw Error('Plik „'+file.name+'” jest pusty lub przekracza '+state.settings.maxMB+' MB.');const bytes=new Uint8Array(await file.slice(0,8).arrayBuffer());const extension=file.name.split('.').pop().toLowerCase();const jpg=bytes[0]===255&&bytes[1]===216&&bytes[2]===255;const png=[137,80,78,71,13,10,26,10].every((b,i)=>bytes[i]===b);const pdf=String.fromCharCode(...bytes.slice(0,5))==='%PDF-';if(!(['jpg','jpeg'].includes(extension)&&jpg||extension==='png'&&png||extension==='pdf'&&pdf))throw Error('Plik „'+file.name+'” nie jest poprawnym JPG, PNG lub PDF.');return jpg?'image/jpeg':png?'image/png':'application/pdf';}

async function deleteUserProfile(id){

 if(!target)throw Error('Nie znaleziono profilu.');

 if(el.id==='m-status'){detailDirty=true;syncClosingFields();}
 if(el.id==='m-priority'){detailDirty=true;updateDueSuggestion();}
 if(el.id==='city'){const choices=availablePlaces().filter(l=>l.city===el.value);$('#mpk').disabled=!el.value;$('#mpk').innerHTML=option('','Wybierz lokal / magazyn')+choices.map(l=>option(l.mpk,l.mpk+' · '+l.name+(l.type==='Magazyn'?' [Magazyn]':'')+(l.location&&l.location!==l.city?' · '+l.location:''),choices.length===1?choices[0].mpk:'')).join('');}
 if(el.id==='attachments'){await perform(()=>addFiles(el.files));el.value='';}
 if(el.id==='restore-file'){await perform(()=>restore(el.files[0]));el.value='';}
});
document.addEventListener('input',event=>{if(event.target.closest('#new-form,#user-form,#location-form,#settings-form'))dirty=true;if(event.target.closest('#manage-form,#comment-form'))detailDirty=true;});
document.addEventListener('dragover',event=>{const zone=event.target.closest('#dropzone');if(zone){event.preventDefault();zone.classList.add('drag');}});
document.addEventListener('dragleave',event=>{event.target.closest('#dropzone')?.classList.remove('drag');});
document.addEventListener('drop',async event=>{const zone=event.target.closest('#dropzone');if(zone){event.preventDefault();zone.classList.remove('drag');await perform(()=>addFiles(event.dataTransfer.files));}});
window.addEventListener('beforeunload',event=>{if(dirty||detailDirty||busy){event.preventDefault();event.returnValue='';}});
for(const dialog of ['detail-dialog','quick-close-dialog','notifications-dialog'].map(id=>document.getElementById(id))){
 dialog.addEventListener('click',event=>{
  if(event.target!==dialog||!dialog.open||busy)return;
  const rect=dialog.getBoundingClientRect();
  if(event.clientX>=rect.left&&event.clientX<=rect.right&&event.clientY>=rect.top&&event.clientY<=rect.bottom)return;
  if(dialog.id==='detail-dialog'){
   if(detailDirty&&!confirm('Odrzucić niezapisane zmiany w zgłoszeniu?'))return;
   detailDirty=false;
  }
  dialog.close();
 });
}
$('#detail-dialog').addEventListener('close',()=>{selectedTicket=null;detailDirty=false;});
$('#quick-close-dialog').addEventListener('close',()=>{quickCloseId=null;});
$('#detail-dialog').addEventListener('cancel',event=>{if(busy||(detailDirty&&!confirm('Odrzucić niezapisane zmiany w zgłoszeniu?')))event.preventDefault();else detailDirty=false;});
</script>
