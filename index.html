<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; manifest-src 'self'; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'"
    >
    <meta name="description" content="Serwis Lokali — zgłaszanie i obsługa usterek.">
    <meta name="theme-color" content="#192e3b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Serwis Lokali">

    <title>Serwis Lokali · Zgłoszenia usterek</title>
    <link rel="manifest" href="./manifest.json?v=15">
    <link rel="icon" type="image/svg+xml" href="./app-icon.svg?v=13">
    <link rel="apple-touch-icon" href="./icon-transparent-192.png">
    <link rel="stylesheet" href="./styles.css?v=11">
    <link rel="stylesheet" href="./ui-polish.css?v=6">
  </head>

  <body>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <img src="./logo.svg?v=11" width="32" height="32" alt="">
        </span>
        <div>Serwis Lokali<small>Zgłoszenia usterek</small></div>
      </div>
      <div class="nav-label">NAWIGACJA</div>
      <nav id="navigation" aria-label="Nawigacja główna"></nav>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="profile">
          <div class="role-switch">
            <label for="profile-select">Widok jako</label>
            <select id="profile-select" aria-label="Przełącz profil testowy"></select>
          </div>
          <button
            id="notification-bell"
            class="notification-bell"
            type="button"
            data-action="notifications"
            aria-label="Powiadomienia"
            aria-haspopup="dialog"
            aria-controls="notifications-dialog"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M9 21h6M12 2V1"/>
            </svg>
            <span class="notification-bell-label">Powiadomienia</span>
            <span class="notification-count" id="notification-count" hidden>0</span>
          </button>
          <div class="profile-current">
            <strong id="profile-name"></strong>
            <small id="profile-role"></small>
          </div>
          <button class="btn secondary small logout-button" type="button" data-action="logout">
            Wyloguj
          </button>
        </div>
      </header>

      <div class="sync-notice" id="sync-notice" hidden>
        <span>Dostępne są nowsze dane z drugiej karty. Twój formularz nie został zmieniony.</span>
        <button type="button" data-action="apply-pending">Wczytaj nowsze dane</button>
      </div>
      <main class="content" id="content">
        <div class="loading" role="status">Łączenie ze wspólną bazą danych…</div>
      </main>
    </div>

    <dialog id="detail-dialog" aria-labelledby="dialog-title"></dialog>
    <dialog id="quick-close-dialog" class="quick-close-dialog" aria-labelledby="quick-close-title"></dialog>
    <dialog id="notifications-dialog" class="notifications-dialog" aria-labelledby="notifications-title"></dialog>
    <div class="toast-container" id="toasts" aria-live="polite"></div>

    <noscript><div class="fatal">Włącz JavaScript, aby korzystać z aplikacji.</div></noscript>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./locations.js?v=4"></script>
    <script src="./app-config.js?v=1"></script>
    <script src="./model.js?v=1"></script>
    <script src="./app-core.js?v=1"></script>
    <script src="./app-views.js?v=1"></script>
    <script src="./app-actions.js?v=1"></script>
    <script src="./app-events.js?v=1"></script>
    <script src="./app-data.js?v=1"></script>
    <script src="./bootstrap.js?v=5"></script>
  </body>
</html>
